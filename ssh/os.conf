# dotfiles-MacBook/ssh/os.conf → ~/.ssh/config.d/50-os.conf
# ──────────────────────────────────────────────────────────────────────────────
# Linked by Core's blib_link_os_layer, and Included by core/ssh/config — which
# Includes ~/.ssh/config.d/*.conf as its FIRST directive, so anything here is
# reached before Core's own stanzas. See dotgibson/dotfiles-core#450.
#
# WHY THIS FILE EXISTS
# --------------------
# Core now owns the portable ssh client config; this repo's root ssh/config used
# to own it locally. Those two agreed on everything except one thing: this host
# uses PER-SERVICE keys (id_ed25519_github, id_ed25519_gitlab) where Core's
# shipped default is a single ~/.ssh/id_ed25519, and Core carries no GitLab
# stanza at all.
#
# Without this file, the first bootstrap after vendoring that Core would silently
# repoint ~/.ssh/config at Core's version and this host would stop offering the
# right key to GitHub and lose its GitLab entry entirely. That is a host
# regression, not a config cleanup, so it is fixed BEFORE the sync lands rather
# than after someone notices `git push` asking for a password.
#
# ON IdentityFile SPECIFICALLY
# ----------------------------
# ssh is first-obtained-value-wins for most keywords, but IdentityFile
# ACCUMULATES. So these do not replace Core's ~/.ssh/id_ed25519 — they are tried
# FIRST and Core's remains a fallback. That is the wanted behaviour here, and it
# is why no `IdentitiesOnly yes` is set: adding it would restrict this host to
# exactly the files listed and stop agent-held keys from being offered, which is
# a behaviour change rather than a preservation of one.
# ──────────────────────────────────────────────────────────────────────────────

Host github.com
  IdentityFile ~/.ssh/id_ed25519_github

Host gitlab.com
  HostName gitlab.com
  User git
  IdentityFile ~/.ssh/id_ed25519_gitlab
  AddKeysToAgent yes
