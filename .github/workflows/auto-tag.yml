name: auto-tag

# Cut THIS repo's own next vX.Y.Z release tag when the INSTALLABLE state of the repo
# changes. Delegates to the reusable workflow in dotfiles-core — one definition of the
# version math + tagging (scripts/auto-tag.sh): PATCH-bump by default, idempotent (a
# no-op when HEAD is already tagged vX.Y.Z), and it tags in CI so the second version
# line (this repo's own tag) stops drifting from the Core it vendors. SHA-pinned to the
# Core commit this repo vendors, per core.lock — stated as the invariant rather than a
# version number, because naming one here dates the comment on every sync while
# test/check-pins.sh only validates the trailing comment on the `uses:` line. That
# trailing comment is what Renovate reads to bump it, and check-pins.sh asserts both it
# and the SHA still equal core.lock.
#
# DELIBERATE DEVIATION from the reusable's documented caller shape, which is
# `paths: ['core/**']`. That shape assumes the only thing worth releasing is a Core
# fan-out — true for a repo that owns nothing else, false here. Under it, eight merged
# PRs of real install-path work (fresh-machine blockers, an uninstall gap, module
# selection, secret/config/markdown gates) produced ZERO tags, while the tag line kept
# advancing on Core syncs alone. The tag claimed to describe this repo and actually
# described its vendored dependency. Please don't "restore" the upstream shape on a
# future sync without also solving that.
#
# DENYLIST, not an allowlist, on purpose. The default answer is "this changed what gets
# installed, so cut a tag", and only what demonstrably does NOT ship is carved out. An
# allowlist would fail the same way the old filter did: add a new installable directory,
# forget to list it, and releases silently stop. The denylist's failure mode is a
# spurious patch tag — noisy, not wrong. `!` patterns are evaluated in order, so the
# exclusions below override the `**` above.
on:
  push:
    branches: [main]
    paths:
      - '**'
      # Docs and licence — never installed. BOTH markdown forms are listed on purpose:
      # GitHub documents `**.js` as matching "all .js files in the repository", which
      # implies `**` spans directory separators — but the filter-pattern semantics are
      # not pinned down explicitly anywhere citable, and this repo has nested markdown
      # (sketchybar/PARITY.md, .github/ISSUE_TEMPLATE/*.md). Listing `**/*.md` as well
      # costs nothing and makes the exclusion correct under either reading, rather than
      # leaving release correctness resting on a disputed glob.
      - '!**.md'
      - '!**/*.md'
      - '!LICENSE'
      # CI plumbing and the test suite — neither is wired into $HOME by bootstrap.sh.
      - '!.github/**'
      - '!test/**'
      # Author-time tooling config: linters, hooks, dependency bot.
      - '!.editorconfig'
      - '!.markdownlint.jsonc'
      - '!.pre-commit-config.yaml'
      - '!renovate.json'

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    uses: dotgibson/dotfiles-core/.github/workflows/auto-tag-call.yml@0d9223d91805cbd666c6a7ff07bf400e3d20e716 # v4
