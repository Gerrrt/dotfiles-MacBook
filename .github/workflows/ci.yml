name: CI

# Static-analysis gate for the repo-owned shell + the workflow itself, plus an
# integrity gate on the vendored Core layer. Dotfiles can't be unit-tested, so
# shellcheck + shfmt + `bash -n`/`zsh -n` ARE the suite for repo-owned files.
#
# The vendored layer is gated by `verify-core`, which diffs core/ byte-for-byte against
# the subset upstream says it should carry. It replaced a `core regression` job that ran
# Core's own audit + behavioral suite out of core/ — that tooling is no longer vendored
# (dotfiles-core#676), and the job ran on ubuntu-latest, so it was a second Linux run of
# suites dotfiles-core's own CI already runs on the same tree before it is vendored here.
# core/ static findings are surfaced by a non-blocking advisory step (fixes land upstream).

on:
  # De-duplicated triggers: a PR'd branch previously ran CI TWICE (the `push` and the
  # `pull_request` event fire for the same commit, and their github.ref differs so
  # concurrency didn't collapse them). Now `push` is scoped to the default branch + tags
  # (post-merge / release signal); everything else is gated by `pull_request`.
  #
  # NO `paths-ignore` HERE — deliberately. It is the one kind of skip that DEADLOCKS a
  # required status check. GitHub treats the two kinds very differently:
  #
  #   • a job skipped by a job-level `if:` reports conclusion `skipped`, which a required
  #     check counts as PASSING — this is what the `changes` gating below produces, and
  #     it is fine;
  #   • a workflow skipped by `paths-ignore` never creates its check runs AT ALL, so a
  #     required context sits in "Expected — waiting for status" forever and the PR can
  #     never be merged.
  #
  # So the moment any `CI` context became required, a docs-only PR would be permanently
  # unmergeable. The work is still skipped for docs — the `changes` job below classifies
  # `*.md`/`LICENSE` as inert, so only the two cheap jobs (`changes`, `actionlint`) plus
  # the `ci-ok` gate actually run — but every context now reports on every PR.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Incremental CI: a newer push to the same ref cancels the in-flight run rather
# than letting a stale job burn minutes next to the fresh one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Incremental CI: classify the changed paths so a core-only or repo-shell-only PR
  # doesn't pay the full matrix. FAIL-SAFE — if the diff base can't be resolved (first
  # push, force-push, shallow), or an infra path (.github/Makefile) changed, BOTH flags
  # are true and nothing downstream is skipped.
  #
  # This job is now the ONLY thing that skips docs-only work: the workflow-level
  # `paths-ignore` was removed (see the `on:` comment) because it deadlocks required
  # checks. A pure-docs change matches the `*.md | LICENSE` inert arm below, leaving both
  # flags false, so every heavy leg skips — but each one still REPORTS, which is what a
  # required status check needs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.f.outputs.core }}
      shell: ${{ steps.f.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the diff base resolves
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          base=""
          if [ "$EVENT" = pull_request ]; then
            git fetch -q origin "$BASE_REF" 2>/dev/null && base="origin/$BASE_REF" || base=""
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          fi
          if [ -z "$base" ] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "diff base unknown — running everything (safe default)"
            { echo "core=true"; echo "shell=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "changed files vs $base:"; printf '%s\n' "$files" | sed 's/^/  /'
          core=false shell=false
          while IFS= read -r f; do
            [ -z "$f" ] || case "$f" in
            core/*) core=true ;;
            .github/* | Makefile) core=true shell=true ;; # infra → full (fail-safe)
            *.md | LICENSE) ;;                             # inert
            *) shell=true ;;                               # repo-owned shell/zsh/config
            esac
          done <<EOF
          $files
          EOF
          echo "→ core=$core shell=$shell"
          { echo "core=$core"; echo "shell=$shell"; } >> "$GITHUB_OUTPUT"

  shell:
    name: shell lint
    needs: changes
    # repo-owned lint + the core/ advisory; run when repo shell OR vendored core changed.
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Load the pinned linter versions AND their SHA-256 from the VENDORED Core single
      # source into the job env, so the setup-core-tools action below verifies each
      # download against its pin (it reads TOOL_VERSION + TOOL_SHA256 from the env). This
      # also keeps the pins from drifting per-repo — they had already drifted once (this
      # repo pinned actionlint 1.7.7 while Core moved to 1.7.8) — so a Core bump now
      # propagates on the next subtree pull. Must precede the install step below.
      - name: Load pinned tool versions + checksums (vendored Core single source)
        run: grep -E '^[A-Z0-9_]+=' core/scripts/tool-versions.env >> "$GITHUB_ENV"

      # zsh is needed for `make zsh-syntax` + the repo behavioral tests (the repo-owned
      # zsh modules have no .sh extension, so the bash gate never reached them).
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # shellcheck + shfmt via the shared, vendored Core composite action, which verifies
      # each download against a pinned SHA-256 before installing — replacing this job's
      # former inline `curl` blocks (no integrity check) and the per-repo SHFMT_VERSION
      # literal (shfmt is now pinned in the vendored tool-versions.env). `make shellcheck`
      # / `make fmt-check` find both on the PATH dir added below.
      - name: Put core-tools bin on PATH
        run: |
          mkdir -p "$HOME/.local/core-tools/bin"
          echo "$HOME/.local/core-tools/bin" >> "$GITHUB_PATH"

      - name: Cache pinned gate tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/core-tools
          key: core-tools-${{ runner.os }}-${{ hashFiles('core/scripts/tool-versions.env') }}-shell
          restore-keys: |
            core-tools-${{ runner.os }}-${{ hashFiles('core/scripts/tool-versions.env') }}-

      - name: Install pinned gate tools (verified)
        uses: ./core/.github/actions/setup-core-tools
        with:
          shellcheck: "true"
          shfmt: "true"
          gitleaks: "true"

      # Defense in depth: assert make's shellcheck/shfmt are the verified ones from
      # bindir, not a preinstalled copy shadowing them on PATH (the bypass fixed in core#81).
      - name: Assert gate tools resolve to the verified bindir
        run: |
          bindir="$HOME/.local/core-tools/bin"
          rc=0
          for t in shellcheck shfmt; do
            p="$(command -v "$t" || true)"
            echo "$t -> ${p:-<not found>}"
            [ "$p" = "$bindir/$t" ] || { echo "::error::$t is '${p:-<not found>}', not the verified $bindir/$t"; rc=1; }
          done
          exit $rc

      - name: shellcheck
        run: make shellcheck

      - name: shfmt (format check)
        run: make fmt-check

      - name: bash -n (syntax)
        run: make syntax

      - name: zsh -n (syntax)
        run: make zsh-syntax

      # A bash RETURN trap is a GLOBAL slot, not a function-scoped one: armed inside a
      # function it survives into the CALLER's frame and fires again on ITS return, where
      # the local it cleans up is out of scope and `set -u` makes it fatal. That aborted
      # dotfiles-Debian's bootstrap after every package installed but before wire_links ran
      # (dotgibson/dotfiles-Debian#2). The two steps above CANNOT see it — the broken line
      # is valid bash — which is why it is its own leg.
      #
      # Core v4.14.0 ships this rule as a blocking leg of the reusable lint-call.yml. This
      # repo does not call that workflow (its gate is fuller: gitleaks, markdownlint, config
      # parsing, pin checks), so the rule is PORTED rather than inherited — reusing the
      # vendored _core_return_trap_hits, not a copy of it. See #154; dotfiles-core#564
      # tracks the general problem of these two gates drifting apart.
      - name: RETURN-trap discipline
        run: make trap-guard

      - name: repo behavioral tests (bootstrap, loader, defaults)
        run: make test

      # The macOS desktop layer is JSON/TOML and nothing parsed it — a malformed
      # karabiner.json or aerospace.toml shipped green and only failed on the next fresh
      # install. python3 is preinstalled on the runner (3.11+, so tomllib is available).
      - name: structured config parse (json/jsonc/toml)
        run: make config-check

      # .markdownlint.jsonc existed but nothing ran it. markdownlint-cli2 is npm-only, so
      # it is version-pinned from the vendored tool-versions.env and run via npx (node is
      # preinstalled on the runner).
      - name: markdownlint
        run: make markdownlint

      # Repo-owned secret scan. Core's audit covers core/ only; this covers the tree this
      # repo actually owns. gitleaks is installed above by setup-core-tools, SHA-verified
      # against the pin in the vendored tool-versions.env.
      - name: gitleaks (secret scan)
        run: make secrets

      - name: core/ advisory (non-blocking)
        run: make core-advisory

  # Byte-for-byte integrity of the vendored subtree against upstream @ the recorded
  # subtree-split commit — the backstop for drift the dir-granular manifest can't see
  # (a hand-edited or orphaned file inside a manifested directory). Needs full history so
  # the git-subtree-split marker resolves.
  #
  # UNGATED on purpose (it used to run only when core/** changed). Two reasons: the job is
  # ~10s, and the gate had a blind spot — `changes` classifies test/verify-core.sh itself as
  # shell-only, so a PR editing the gate did not run the gate. Cheap enough that "always"
  # beats reasoning about when it matters.
  verify-core:
    name: verify vendored core
    runs-on: ubuntu-latest
    # Refuse to skip here. On a laptop verify-core exits 0 when it cannot reach upstream —
    # correct there, hostile otherwise — but in a CI log a skip is indistinguishable from a
    # pass, so a network blip would quietly disarm the gate. Strict makes that a failure.
    env:
      VERIFY_CORE_STRICT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the subtree commit history for the split marker
      - name: Verify vendored core/ == upstream @ subtree-split
        run: make core-verify

      # The third Core reference. verify-core proves the SUBTREE matches core.lock; this
      # proves the reusable workflows this repo CALLS point at that same commit. Kept a
      # separate step because it is a distinct claim about a distinct artifact — and it is
      # offline, so it holds even if the fetch above is what failed.
      - name: Workflow SHA pins match the vendored Core
        run: make pins-check

  # ── file hygiene: the upstream pre-commit hooks CI never ran ─────────────────
  # .pre-commit-config.yaml has always carried nine upstream file-hygiene hooks
  # (whitespace, EOF newlines, line endings, merge markers, shebang↔exec-bit, yaml/json/
  # toml well-formedness). NOTHING ran them. CI drives `make` targets and never invokes
  # pre-commit at all, so those nine existed only on a contributor's box — and there only
  # over the files a commit CHANGES. Anything already wrong was invisible to both halves:
  # CI never looked, and locally it was never in the changed set until someone happened to
  # edit that file, at which point it blocked THEIR commit for a defect they had not
  # introduced. That is exactly how #164 (a shebang with no exec bit) and #165 (trailing
  # blank lines that end-of-file-fixer silently re-fixed on every full run) both sat in the
  # tree unnoticed until `pre-commit run --all-files` was typed by hand during #163.
  #
  # PORTED from Core's own `precommit` job, not reinvented — the same idiom as the
  # RETURN-trap gate above (#154): this repo does not call Core's reusable workflows, so a
  # rule it wants has to be carried across rather than inherited. Running the REAL config
  # is the whole point; a reimplementation would be one more thing to drift.
  #
  # UNCONDITIONAL, unlike `shell lint`. File hygiene applies to every tracked file, and the
  # `changes` filter marks `*.md` inert — so a docs-only PR skips every other leg. Those are
  # precisely the files that collect trailing whitespace, and `--all-files` means the check
  # is over the whole tree regardless of what the PR touched.
  #
  # The SKIP list is every hook CI ALREADY runs as a make step, one-to-one and verifiable
  # against the steps above: shellcheck/shfmt (`make shellcheck`, `make fmt-check`),
  # zsh-syntax, gitleaks (`make secrets`), config-check, markdownlint, test-repo, pins-check
  # (in `verify vendored core`), and actionlint (its own job below). Skipping them keeps
  # this the fast lane and — for shfmt specifically — stops pre-commit fetching its own
  # UNPINNED copy of a tool the shell job takes care to install SHA-256-verified.
  #
  # Note the drift direction, which is the safe one: a NEW upstream hook added to the
  # config is picked up here automatically, because this runs everything it is not told to
  # skip. A new LOCAL hook merely runs twice, or fails loudly for a tool this job does not
  # install — never silently unchecked.
  precommit:
    name: file hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single source of truth for the pinned pre-commit version, same as every other job.
      - name: Load pinned tool versions (vendored Core single source)
        run: grep -E '^[A-Z0-9_]+=' core/scripts/tool-versions.env >> "$GITHUB_ENV"

      # Cache the hook environments pre-commit clones + builds, keyed on the config so a
      # hook-rev bump (or a new hook) rotates the key automatically.
      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # pipx is preinstalled on the runner and installs to ~/.local/bin (already on PATH),
      # sidestepping PEP-668 "externally-managed-environment" pip errors.
      - name: Install pre-commit (pinned)
        run: pipx install "pre-commit==${PRECOMMIT_VERSION}"

      # --show-diff-on-failure matters here: the hygiene hooks FIX rather than only report,
      # so on a red run the diff IS the remedy — a contributor can apply it without
      # reproducing the environment.
      - name: Run hygiene hooks (make-owned hooks skipped)
        env:
          SKIP: shellcheck,shfmt,actionlint,zsh-syntax,gitleaks,config-check,pins-check,markdownlint,test-repo
        run: pre-commit run --all-files --show-diff-on-failure

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Load the pinned versions + their SHA-256 from the vendored Core single source
      # (ACTIONLINT_VERSION was a literal 1.7.7 here, already behind Core's 1.7.8). The
      # setup-core-tools action reads these to verify the download. Must precede it.
      - name: Load pinned tool versions + checksums (vendored Core single source)
        run: grep -E '^[A-Z0-9_]+=' core/scripts/tool-versions.env >> "$GITHUB_ENV"

      # actionlint via the shared, vendored Core composite action (SHA-256-verified
      # download), replacing the former inline `curl` install.
      - name: Put core-tools bin on PATH
        run: |
          mkdir -p "$HOME/.local/core-tools/bin"
          echo "$HOME/.local/core-tools/bin" >> "$GITHUB_PATH"

      - name: Cache pinned gate tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/core-tools
          key: core-tools-${{ runner.os }}-${{ hashFiles('core/scripts/tool-versions.env') }}-actionlint
          restore-keys: |
            core-tools-${{ runner.os }}-${{ hashFiles('core/scripts/tool-versions.env') }}-

      - name: Install pinned gate tools (verified)
        uses: ./core/.github/actions/setup-core-tools
        with:
          actionlint: "true"

      - name: Assert gate tools resolve to the verified bindir
        run: |
          bindir="$HOME/.local/core-tools/bin"
          p="$(command -v actionlint || true)"
          echo "actionlint -> ${p:-<not found>}"
          [ "$p" = "$bindir/actionlint" ] || { echo "::error::actionlint is '${p:-<not found>}', not the verified $bindir/actionlint"; exit 1; }

      - name: actionlint
        run: actionlint -color

  # The lint/regression jobs above run on Ubuntu and never exercise the macOS
  # execution path — the exact surface this repo OWNS. This job runs the real macOS
  # code paths that Linux can't: the native clipboard (pbcopy/pbpaste), the Brewfile
  # parse, and bootstrap/defaults under a genuine Darwin uname. It is intentionally
  # install-free (no `brew bundle`, which would take many minutes) — it validates that
  # the entry points RUN on macOS, not that every package is present.
  macos:
    name: macos smoke
    needs: changes
    # Exercises the macOS entry points (bootstrap/clipboard/Brewfile) — relevant when repo
    # shell OR vendored core changed. Skipped for, e.g., a workflow-only or inert change.
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.core == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native clipboard round-trip: Core's clip/clip-paste shell out to pbcopy/pbpaste
      # on Darwin. Linux tests stub these, so a real-macOS quoting/exec bug in clip would
      # otherwise ship undetected. (clip lives in vendored core/, but it RUNS here.)
      - name: clipboard round-trip (pbcopy/pbpaste)
        run: |
          chmod +x core/bin/clip core/bin/clip-paste
          msg="dotfiles-ci-$RANDOM"
          printf '%s' "$msg" | core/bin/clip
          got="$(core/bin/clip-paste)"
          if [ "$got" != "$msg" ]; then
            echo "clipboard round-trip mismatch: wrote '$msg', read '$got'" >&2
            exit 1
          fi
          echo "clipboard round-trip OK ($msg)"

      # Parse the Brewfile with the real brew (preinstalled on the runner). Catches a
      # malformed Brewfile without the cost of installing every formula/cask. This is the
      # macOS Brewfile gate: Homebrew 4.x removed Brewfile.lock.json generation (and 6.x
      # has no lock support at all), so there's no lockfile to gate on — `brew bundle check`
      # would need the full toolchain installed, which this install-free job deliberately
      # skips. The Brewfile itself is the committed source of truth; `make brew-check`
      # verifies it on a real (provisioned) machine.
      - name: Brewfile parses
        run: brew bundle list --file=Brewfile --all >/dev/null && echo "Brewfile OK"

      # Real-Darwin smoke of the entry points: the symlink plan (catches a dead link
      # SOURCE, e.g. a renamed core file) and the defaults dry-run, both no-ops.
      - name: bootstrap + defaults dry-run (no mutations)
        run: |
          ./bootstrap.sh --links-only --dry-run
          bash macos/defaults.sh --dry-run >/dev/null

      # THE PROVISION GATE — this leg, and only this leg, executes bootstrap.sh's
      # provision(). test-repo.sh's provision sections self-skip where `xcode-select -p`
      # fails, which is every Linux runner, so the `shell lint` copy of `make test-repo`
      # runs everything EXCEPT those. Core's reusable bootstrap-test.yml provision-stub
      # job is Linux-container-only (three ubuntu-latest jobs, two of them `docker run`)
      # and cannot reach a provision() that hard-exits without the Command Line Tools —
      # which is why this repo gates it HERE instead of calling that workflow (#178).
      #
      # HONEST LIMIT: a green run proves provision() ran, branched, and returned/exited as
      # designed. Nothing is installed, so it says nothing about whether the Brewfile's
      # formulae exist or a cask name is right — only `make brew-check` on a provisioned
      # machine covers that.
      #
      # The env marker is LOAD-BEARING, not decoration: test-repo.sh section G2 reads it
      # and FAILS if the sections it names all self-skipped, so this gate cannot quietly
      # stop gating (the same discipline as the VERIFY_CORE_STRICT pin in section G).
      - name: repo behavioral tests (on real macOS)
        env:
          REPO_TESTS_GATE_PROVISION: 1
        run: make test

  # ── the single required status check ─────────────────────────────────────────
  # Branch rulesets should require THIS job and nothing else from this workflow.
  #
  # Why an aggregation gate rather than requiring the six jobs directly:
  #   • the jobs above are conditional, and their names ("shell lint", "macos smoke", …)
  #     are the ruleset's contract — renaming one silently drops a required check while
  #     the ruleset still shows green, because a context that never reports is only
  #     "pending", and a ruleset listing a context that no longer exists blocks forever;
  #   • one stable name means adding or renaming a leg needs no ruleset edit.
  #
  # `if: always()` is essential: without it this job would itself be skipped whenever any
  # dependency failed, and a skipped required check counts as PASSING — precisely
  # inverting the gate. With `always()` it runs regardless and inspects the results.
  #
  # `skipped` is deliberately NOT a failure: the `changes` job legitimately skips the
  # heavy legs for docs-only or core-only PRs, and that is the design.
  ci-ok:
    name: ci ok
    if: always()
    needs: [changes, shell, verify-core, actionlint, macos, precommit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert no required leg failed
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::a CI leg failed or was cancelled — see the jobs above"
            exit 1
          fi
          echo "all CI legs passed or were legitimately skipped"
