# Local commit-time lint gate. One-time setup:  pre-commit install
# Mirrors the CI checks (see .github/workflows/ci.yml) so failures surface before push.
#
# core/ is a vendored git-subtree from dotfiles-core — excluded globally so hooks
# never rewrite vendored files (that would diverge the subtree). It is linted in
# dotfiles-core's own CI. See README "Development".
exclude: "^core/"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      # The macOS desktop layer is JSON/TOML and nothing checked it. `check-json` is
      # strict, so the JSONC files (comments are legal there) are excluded and covered by
      # `make config-check` below, which understands both dialects.
      - id: check-json
        exclude: '\.jsonc$'
      - id: check-toml

  # shellcheck runs through `make shellcheck` — the SAME command ci.yml runs — rather than
  # koalaman/shellcheck-precommit, whose `shellcheck` id is a `language: docker_image`
  # hook. With no Docker daemon that hook does not skip, it ERRORS
  # (`CalledProcessError: Executable 'docker' not found`) and blocks the commit outright,
  # so on a box without Docker the local gate could not run AT ALL — the exact inverse of
  # what this file exists for. Nothing here ever needed Docker: the Brewfile installs
  # shellcheck, and CI runs `make shellcheck` against a SHA-256-verified binary.
  #
  # It also finishes what #160 started. That change made the repo-root .shellcheckrc the
  # ONE shellcheck config "so author-time, CI, and the editor all lint identically" — but
  # a pinned v0.10.0 container is a third toolchain that the local `shellcheck` and CI's
  # verified 0.11.0 are not. Going through make leaves one command and one config.
  #
  # And it drops a second, UNGATED source of version truth: core/scripts/tool-versions.env
  # is canonical (SHELLCHECK_VERSION=0.11.0) and Core's audit asserts the rev fields — but
  # that audit runs `cd core` first, so THIS file was never covered and its pin had already
  # drifted to v0.10.0 unnoticed. Deferring to the installed binary leaves nothing to drift.
  #
  # Deliberately NOT version-gated. A contributor whose shellcheck trails CI's gets a
  # weaker local check, never a wrong one, and CI is still unconditional — whereas a hard
  # minimum would swap today's hard-fail (no Docker) for a new one (brew a fortnight
  # behind), which is the failure mode this change exists to remove.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (repo-owned bash)
        entry: make shellcheck
        language: system
        pass_filenames: false
        # Mirrors SH_FILES in the Makefile: every *.sh outside core/ (excluded globally
        # above) plus the two bash entry points that carry no .sh extension.
        files: '(\.sh$|^sketchybar/sketchybarrc$|^borders/bordersrc$)'

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -d]

  # ── Mirror the remaining CI gates so "passes pre-commit" == "passes CI" ──────
  # CI also runs actionlint and `zsh -n`; without these two the local gate was a
  # subset and a workflow/zsh break could pass pre-commit yet fail CI. These use
  # the system binaries the Brewfile already installs (actionlint, zsh) — there's
  # no pinned, toolchain-free pre-commit-managed binary for either.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint (GitHub Actions workflows)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zsh-syntax
        name: zsh -n (repo-owned zsh modules)
        entry: make zsh-syntax
        language: system
        pass_filenames: false
        files: (\.zsh$|^zsh/)
      # Secret scan over the REPO-OWNED tree. Core's audit runs gitleaks over core/ only,
      # so Brewfile, os/, zsh/, ssh/config, sketchybar/ and macos/defaults.sh were never
      # scanned by anything — GitHub push protection was the only net, and it only fires
      # after you try to push. Unfiltered by `files:` on purpose: a secret can land in any
      # file, so this runs on every commit.
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: make secrets
        language: system
        pass_filenames: false
      - id: config-check
        name: structured config parse (json/jsonc/toml)
        entry: make config-check
        language: system
        pass_filenames: false
        files: '\.(json|jsonc|toml)$'
      - id: pins-check
        name: workflow SHA pins match core.lock
        entry: make pins-check
        language: system
        pass_filenames: false
        files: (^\.github/workflows/|^core\.lock$)
      - id: markdownlint
        name: markdownlint (repo-owned markdown)
        entry: make markdownlint
        language: system
        pass_filenames: false
        files: '\.md$'
      # Behavioral gate for the repo-owned scripts (bootstrap.sh, the zsh loader,
      # macos/defaults.sh, the bootstrap completion). Hermetic + fast; mirrors the
      # CI "repo behavioral tests" step so "passes pre-commit" == "passes CI".
      - id: test-repo
        name: repo behavioral tests
        entry: make test-repo
        language: system
        pass_filenames: false
        files: (^bootstrap\.sh$|^macos/defaults\.sh$|^zsh/|^os/|^completions/|^test/)
